; Pengaturan subdomain testing RF Studio untuk upload galeri Google Drive.
; Beberapa provider cPanel menerapkan perubahan user.ini hingga sekitar 5 menit.
upload_max_filesize = 25M
post_max_size = 32M
max_file_uploads = 220
max_execution_time = 240
max_input_time = 240
memory_limit = 256M
session.gc_maxlifetime = 7200
